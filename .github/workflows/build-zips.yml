name: Build distribution zips

# dist/skills/*.zip are what people on the Claude Free plan upload, one per
# skill. dist/download/*.zip are what the Download button on policymemo.ai
# serves. Both are generated by tools/build-zips.py from skills/,
# marketplace.json and the licences, never edited by hand. This rebuilds them
# whenever a source changes, so a download can never drift from its source.

on:
  push:
    paths:
      - "skills/**"
      - ".claude-plugin/marketplace.json"
      - "tools/build-zips.py"
      - "LICENSE"
      - "LICENSE-CONTENT.md"
      - ".github/workflows/build-zips.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the zips
        run: |
          python3 tools/build-zips.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/skills dist/download
          if git diff --cached --quiet; then
            echo "Zips already match source. Nothing to do."
          else
            git commit -m "Rebuild distribution zips from source"
            git push
          fi
