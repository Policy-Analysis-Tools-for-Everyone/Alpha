name: Build site

# Everything in docs/ apart from index.html's hand-written parts, the icons and
# the redirect stubs is generated from site/ by tools/build-site.py. This
# rebuilds it whenever a source file or the script changes, so the published
# site never drifts from its source.

on:
  push:
    paths:
      - "site/**"
      - "tools/build-site.py"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          pip install markdown
          python3 tools/build-site.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Site already matches source. Nothing to do."
          else
            git commit -m "Rebuild the site from site/"
            git push
          fi
