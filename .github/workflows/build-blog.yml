name: Build blog

# docs/blog/, docs/install/, docs/beta/, docs/updates/, docs/skills/ and the
# generated links on the homepage are built from blog/posts/, install/, beta/,
# updates/ and skill-pages/ by tools/build-blog.py. This rebuilds them whenever a post, the blog styles
# or the build script changes, so the published blog never drifts from its source.

on:
  push:
    paths:
      - "blog/**"
      - "install/**"
      - "beta/**"
      - "updates/**"
      - "skill-pages/**"
      - "tools/build-blog.py"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the blog
        run: |
          pip install markdown
          python3 tools/build-blog.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Blog already matches source. Nothing to do."
          else
            git commit -m "Rebuild the blog from blog/posts"
            git push
          fi
