name: Build distribution zips

# dist/skills/*.zip are what people on the Claude Free plan download, one
# per skill. dist/plugin/*.zip are self-contained plugin packages for
# claude.ai's Upload local plugin, used when the marketplace install fails.
# Both are generated, never edited by hand, from skills/ and
# marketplace.json. This rebuilds them whenever either changes, so a
# download can never drift from its source.

on:
  push:
    paths:
      - "skills/**"
      - ".claude-plugin/marketplace.json"
      - "tools/build-skill-zips.py"
      - "tools/build-plugin-zips.py"
      - ".github/workflows/build-skill-zips.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the zips
        run: |
          python3 tools/build-skill-zips.py
          python3 tools/build-plugin-zips.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/skills dist/plugin
          if git diff --cached --quiet; then
            echo "Zips already match source. Nothing to do."
          else
            git commit -m "Rebuild distribution zips from source"
            git push
          fi
