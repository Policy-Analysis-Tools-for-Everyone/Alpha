name: Build Copilot and Gemini ports

# dist/ports/ holds the Microsoft 365 Copilot and Google Gemini versions of
# policymemo.ai, generated from skills/ and ports/core.md by
# tools/build-ports.py. This rebuilds them whenever either changes, so a port
# never drifts from the Claude version.
#
# If house-rules has changed since ports/core.md was last reviewed, the build
# exits 2 and this job fails on purpose. Update core.md, then run
# tools/build-ports.py --accept-house-rules locally and push. The Claude zips
# are built by a separate workflow and are not held up.

on:
  push:
    paths:
      - "skills/**"
      - "ports/**"
      - "tools/build-ports.py"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/build-ports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build dates each port by the last commit touching its inputs.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the ports
        run: python3 tools/build-ports.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ports
          if git diff --cached --quiet; then
            echo "Ports already match source. Nothing to do."
          else
            git commit -m "Rebuild Copilot and Gemini ports from source"
            # The zip workflow can push on the same trigger.
            git pull --rebase
            git push
          fi
