<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>policymemo.ai</title>
<meta name="description" content="policymemo.ai 0.1.2. MDEE.MD: a toolkit for working through a public policy problem properly. Alpha, coming soon.">
<meta name="theme-color" content="#e8e8e6">
<style>
  :root { --bg: #e8e8e6; --ink: #1d1d1b; --muted: #6b6b68; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 16px; text-align: center;
  }
  svg { width: min(200px, 50vw); height: auto; display: block; margin: 0 auto 8px; cursor: pointer;
        filter: drop-shadow(0 10px 18px rgba(0,0,0,.12)); }
  svg.shake { animation: shake .45s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(7px) rotate(2.5deg); }
    60% { transform: translateX(-5px) rotate(-1.5deg); }
    80% { transform: translateX(3px) rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce) { svg.shake { animation-duration: .2s; } }
  .label { font-size: 13px; font-weight: 500; margin-bottom: 28px; }
  p { max-width: 340px; margin: 0 auto; color: var(--muted); }
  nav { margin-top: 20px; display: flex; gap: 20px; justify-content: center; font-size: 14px; }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(0,0,0,.25); }
  a:hover, a:focus-visible { border-color: var(--ink); outline: none; }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 260 200" role="img" aria-label="Folder">
      <defs>
        <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4f9fe3"/><stop offset="1" stop-color="#3d8bd6"/>
        </linearGradient>
        <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ccaf9"/><stop offset="1" stop-color="#6db4f2"/>
        </linearGradient>
      </defs>
      <!-- back + tab -->
      <path d="M10 26a14 14 0 0 1 14-14h66a14 14 0 0 1 10 4l10 10h126a14 14 0 0 1 14 14v140H10z" fill="url(#back)"/>
      <!-- paper -->
      <rect x="20" y="34" width="220" height="40" rx="4" fill="#fff" fill-opacity=".92"/>
      <!-- front -->
      <rect x="6" y="46" width="248" height="146" rx="14" fill="url(#front)"/>
      <path d="M20 46.8h220" stroke="#b9e0ff" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div class="label">policymemo.ai.0.1.2</div>
    <p>A toolkit that helps you work through a policy problem properly. Alpha, coming soon.</p>
    <nav>
      <a href="https://github.com/Policy-Analysis-Tools-for-Everyone/Alpha/raw/main/dist/plugin/mdee.zip">Download</a>
      <a href="https://github.com/Policy-Analysis-Tools-for-Everyone/Alpha#install-mdeemd-in-claude">Install guide</a>
      <a href="https://github.com/Policy-Analysis-Tools-for-Everyone/Alpha">GitHub</a>
    </nav>
  </main>
  <script>
    const folder = document.querySelector('svg');
    folder.addEventListener('click', () => {
      folder.classList.remove('shake');
      void folder.getBoundingClientRect();
      folder.classList.add('shake');
    });
    folder.addEventListener('animationend', () => folder.classList.remove('shake'));
  </script>
</body>
</html>
